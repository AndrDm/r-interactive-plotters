[package]
name = "interactive-plotters"
version = "0.1.0"
edition = "2024"
default-run = "interactive-plotters"

[[bin]]
name = "interactive-plotters"
path = "src/main.rs"

[dependencies]
egui = "0.36"
eframe = "0.36"
egui_plot = "0.37"
serde = { version = "1.0", features = ["derive"] }

[[bin]]
name = "basic_interactive"
path = "src/basic_interactive.rs"

[[bin]]
name = "advanced_annotations"
path = "src/advanced_annotations.rs"

[[bin]]
name = "interactive_measurements"
path = "src/interactive_measurements.rs"

[[bin]]
name = "coordinate_system"
path = "src/coordinate_system.rs"

[[bin]]
name = "timeline_chart"
path = "src/timeline_chart.rs"
